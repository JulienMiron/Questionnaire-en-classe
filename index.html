<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeux en classe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="board">
  <main class="landing">
    <div class="chalk-title">
      <h1>Jeux en classe</h1>
      <p class="subtitle">Choisis le jeu auquel la classe va jouer.</p>
    </div>

    <div class="landing-choices">
      <a class="choice-card choice-host" href="questionnaire.html">
        <span class="choice-mark">◆</span>
        <span class="choice-label">Questionnaire en classe</span>
        <span class="choice-hint">Questions à choix de réponse, chaque équipe répond sur son propre appareil</span>
      </a>
      <a class="choice-card choice-team" href="jeopardy.html">
        <span class="choice-mark">▦</span>
        <span class="choice-label">Jeopardy</span>
        <span class="choice-hint">Un seul écran au tableau : les équipes choisissent une case et l'animateur attribue les points</span>
      </a>
    </div>
  </main>
</body>
</html>
