<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questionnaire en classe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<body class="board">
  <main class="landing">
    <div class="chalk-title">
      <h1>Questionnaire<br>en classe</h1>
      <p class="subtitle">Un jeu-questionnaire par équipes, chacune sur son propre appareil.</p>
    </div>

    <div class="landing-choices">
      <a class="choice-card choice-host" href="host.html">
        <span class="choice-mark">◆</span>
        <span class="choice-label">Je suis l'animateur</span>
        <span class="choice-hint">Crée la partie et affiche-la au tableau</span>
      </a>
      <a class="choice-card choice-team" href="play.html">
        <span class="choice-mark">●</span>
        <span class="choice-label">Je suis une équipe</span>
        <span class="choice-hint">Rejoins avec le code donné par l'animateur</span>
      </a>
    </div>
  </main>
